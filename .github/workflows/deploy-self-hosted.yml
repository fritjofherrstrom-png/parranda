name: Deploy self-hosted

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: parranda-self-hosted-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: >-
      vars.PARRANDA_SELF_HOSTED_DEPLOY == 'enabled' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PARRANDA_PRODUCTION_URL }}

    steps:
      - name: Resolve immutable release
        id: release
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHA="${WORKFLOW_SHA:-$DISPATCH_SHA}"
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Checkout exact green commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha }}
          build-args: |
            PARRANDA_BUILD_SHA=${{ steps.release.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Prepare verified SSH identity
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload deployment contract
        id: target
        env:
          CONFIGURED_PATH: ${{ vars.PARRANDA_DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          DEPLOY_PATH="${CONFIGURED_PATH:-/opt/parranda}"
          if [[ "$DEPLOY_PATH" == "/" || ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "PARRANDA_DEPLOY_PATH must be an absolute path without shell metacharacters" >&2
            exit 64
          fi
          ARCHIVE="/tmp/parranda-deploy-${SHA}.tgz"
          RELEASE_PATH="$DEPLOY_PATH/releases/$SHA"
          tar -czf "$ARCHIVE" \
            compose.production.yml \
            deploy/Caddyfile \
            deploy/self-hosted.env.example \
            scripts/deploy-self-hosted.sh
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$RELEASE_PATH'"
          scp "$ARCHIVE" "$SSH_USER@$SSH_HOST:/tmp/parranda-deploy.tgz"
          ssh "$SSH_USER@$SSH_HOST" \
            "tar -xzf /tmp/parranda-deploy.tgz -C '$RELEASE_PATH' && chmod 755 '$RELEASE_PATH/scripts/deploy-self-hosted.sh' && rm /tmp/parranda-deploy.tgz"
          echo "path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Activate and verify exact release
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ steps.target.outputs.path }}
          RELEASE_PATH: ${{ steps.target.outputs.release_path }}
          IMAGE: ${{ steps.release.outputs.image }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "cd '$RELEASE_PATH' && PARRANDA_DEPLOY_ROOT='$DEPLOY_PATH' PARRANDA_IMAGE_REPOSITORY='$IMAGE' ./scripts/deploy-self-hosted.sh '$SHA'"

      - name: Verify public edge
        if: ${{ vars.PARRANDA_PRODUCTION_URL != '' }}
        env:
          APP_URL: ${{ vars.PARRANDA_PRODUCTION_URL }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          for attempt in $(seq 1 30); do
            BODY="$(curl -fsS "$APP_URL/api/health" || true)"
            LIVE_SHA="$(printf '%s' "$BODY" | jq -r '.build_sha // empty' 2>/dev/null || true)"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              curl -fsS "$APP_URL/" >/dev/null
              curl -fsS "$APP_URL/anywhere?lang=en" >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "public edge did not reach $EXPECTED_SHA" >&2
          exit 1
