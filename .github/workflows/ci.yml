name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend foundation
        run: npm run check:frontend

      - name: Test frontend foundation
        run: npm run test:frontend

      - name: Build frontend foundation
        run: npm run build:frontend

      # The serving contract commits frontend/dist as build-output-of-record. A
      # source change without the rebuild-and-commit step would ship stale UI
      # silently — compare the fresh build to the committed dist (Astro's
      # nondeterministic island uid is the one tolerated difference).
      - name: Check committed frontend/dist matches the build
        run: node scripts/check-frontend-dist-drift.js

      - name: Validate self-hosted production contract
        run: npm run validate:self-hosted

      - name: Validate self-hosted Compose configuration
        env:
          PARRANDA_IMAGE: ghcr.io/example/parranda:ci
          PARRANDA_BUILD_SHA: 0000000000000000000000000000000000000000
        run: docker compose -f compose.production.yml config --quiet

      - name: Build self-hosted image
        run: >-
          docker build
          --build-arg PARRANDA_BUILD_SHA=0000000000000000000000000000000000000000
          --tag parranda:self-hosted-ci
          .
