services:
  - type: web
    name: parranda
    runtime: node
    # Also builds the NEW frontend (frontend/dist) so the /anywhere takeover can
    # be flipped on with just PARRANDA_NEW_ANYWHERE=enabled — the flag decides
    # serving, the build is always present. (~1 min extra per deploy.)
    buildCommand: npm install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # NOTE: a persistent disk (durable Overpass/Wikidata cache across redeploys)
    # is DELIBERATELY not declared here — Render disks require a paid instance, and
    # a disk block blocks a clean Blueprint sync on the free tier. The cache lives
    # on ephemeral /tmp instead (per-instance, rebuilt on cold start). Re-add a
    # `disk:` + point PARRANDA_CACHE_DIR at its mountPath when moving to a paid
    # instance — see AGNOSTIC_ENGINE_NORTH_STAR.md for the durable-cache rationale.
    envVars:
      # Turn ON live source acquisition in production. These were unset, so the
      # deployed app ran on curated catalog + city-owned source packs ONLY —
      # every loader / resolver / source-backed PR was dark in prod. The loader
      # is rate-safe to enable now: it is wrapped in a de-duping, TTL, optional
      # file-backed cache (see PARRANDA_CACHE_DIR) so repeat/concurrent lookups
      # for the same anchor never re-hit Overpass.
      - key: PARRANDA_OPEN_DATA_LOADER
        value: enabled
      # Freeform place-name → trusted coordinate anchor (Nominatim). Carries its
      # own UA + 1 req/s gate + bounded queue and shares the persistent-capable
      # cache below; fail-closed.
      - key: PARRANDA_PLACE_RESOLVER
        value: enabled
      # Exact coordinate-bearing Wikidata labels/aliases are a conservative
      # fallback for named areas the primary street geocoder does not index.
      # It never overrides a strong Nominatim result or invents region bounds.
      - key: PARRANDA_WIKIDATA_PLACE_RESOLVER
        value: enabled
      # Source-cache directory — ephemeral /tmp (writable on Render, per-instance,
      # survives across requests within an instance). Point this at a mounted
      # disk's path once on a paid instance for cross-redeploy durability.
      - key: PARRANDA_CACHE_DIR
        value: /tmp/parranda-source-cache
      # Second open source FAMILY: Wikidata notable places (CC0). Independent of
      # OSM, so a place both sources know merges (entity-resolution) into one
      # candidate with two families → real cross-source consensus past the
      # single-family `map` ceiling. Cached like Overpass.
      - key: PARRANDA_WIKIDATA_SOURCE
        value: enabled
      # Second broad global place family: Overture's monthly open Places
      # GeoParquet. Bounded bbox reads warm into the same cache outside the route
      # request and rescue cold locations when public Overpass is unavailable.
      - key: PARRANDA_OVERTURE_SOURCE
        value: enabled
      # TEMPORARY field-deploy setting, NOT the agnostic model. Wikidata label
      # language priority (local first) so names match local OSM names for
      # entity-resolution; `el,en` only because the current field test is Athens.
      # The code default is "en" and the engine is otherwise city-agnostic — the
      # real fix is to resolve label language per request/place/city locale so
      # consensus fires in every city without a per-deploy hint (follow-up; see
      # AGNOSTIC_ENGINE_NORTH_STAR.md). Remove/replace this when that lands.
      - key: PARRANDA_WIKIDATA_LABEL_LANGS
        value: el,en
      # Live events near the anchor — "what's on tonight / this week" from open,
      # key-free municipal feeds (Linked Events; CC-BY). GENERIC + deploy-
      # configurable: a region is a reviewed data row, never code. The registry
      # loads the versioned manifest below; deployments may still override rows
      # through PARRANDA_EVENT_FEEDS without touching the engine.
      # Honest + never required: an anchor no feed covers returns honest absence
      # and the route/districts still compose. Off by default; enabled here.
      - key: PARRANDA_AGNOSTIC_EVENTS
        value: enabled
      # Reviewed regional event sources are versioned as data in the repo. The
      # server reads this file only through trusted deployment configuration;
      # request payloads cannot inject files, endpoints or provider rows.
      - key: PARRANDA_EVENT_FEEDS_FILE
        value: config/reviewed-event-feeds.json
      # NEW-frontend /anywhere takeover (docs/FRONTEND_MIGRATION_CONTRACT.md). The
      # prebuilt surface is committed at frontend/dist and served when this is
      # enabled. Rollback = unset; /labs/anywhere always remains as the fallback.
      - key: PARRANDA_NEW_ANYWHERE
        value: enabled
